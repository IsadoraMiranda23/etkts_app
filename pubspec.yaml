name: etkts_app
description:

version: 1.0.0+25102801

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1
  cupertino_icons: ^1.0.8
  dots_indicator: ^4.0.1
  flutter_native_splash: ^2.4.7
  go_router: ^16.2.5
  google_fonts: ^6.3.2
  google_maps_flutter: ^2.13.1
  google_static_maps_controller: ^1.1.0
  graphql: ^5.2.1
  intl: ^0.20.2
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  graphql_codegen: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets_app/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets_app/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets_app/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets_app/icon.png"